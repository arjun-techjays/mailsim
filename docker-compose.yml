# PostgreSQL for the engine, plus the optional sandboxed simulator containers (profile `app`).
#
# Egress (spec section 10, "No external delivery"; docs/egress.md):
# * `sandbox` is an internal network: no default route and no external DNS. Every simulator
#   container (`app` CLI/runner, `api` REST + IMAP/SMTP listeners, `egress-check`) is attached
#   ONLY to it, so outbound SMTP (25/465/587) and any other direct egress fail at the network
#   level, whatever the application does.
# * `egress-proxy` is the sole bridge: it joins `sandbox` and the routable `egress` network and
#   tunnels only HTTPS CONNECT to EGRESS_ALLOWLIST (the LLM endpoint). Plain HTTP forwarding and
#   every other destination are refused.
# * The simulator containers use their own database, `sandbox-db`, attached ONLY to `sandbox`.
#   The developer/CI database `postgres` joins only `host-access` (for the published loopback
#   port) and never `sandbox`: its superuser can run shell commands (`COPY ... TO PROGRAM`), so a
#   database on both networks would hand anything on `sandbox` a route out.
# Prove it: `docker compose --profile app run --rm egress-check` (CI job `egress`).

x-sandboxed-env: &sandboxed-env
  MAILSIM_DATABASE_URL: postgresql+psycopg://mailsim:mailsim@sandbox-db:5432/mailsim
  MAILSIM_ENV: deployment
  HTTPS_PROXY: http://egress-proxy:3128
  HTTP_PROXY: http://egress-proxy:3128
  NO_PROXY: sandbox-db,localhost,127.0.0.1

services:
  # Developer / CI database on the host's loopback port. Never on `sandbox` (see above).
  postgres:
    image: postgres:16
    # Crash recovery syncs the data directory before replaying WAL. The default (fsync) opens
    # and fsyncs every file of every database: minutes with many test databases on a busy
    # disk. syncfs (PostgreSQL 14+, Linux) syncs each file system once instead.
    command: ["postgres", "-c", "recovery_init_sync_method=syncfs"]
    environment:
      POSTGRES_USER: mailsim
      POSTGRES_PASSWORD: mailsim
      POSTGRES_DB: mailsim
    ports:
      - "127.0.0.1:54329:5432"
    networks: [host-access]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailsim"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  # The simulator containers' database: on `sandbox` only, so it has no route out either.
  sandbox-db:
    profiles: ["app"]
    image: postgres:16
    command: ["postgres", "-c", "recovery_init_sync_method=syncfs"]
    environment:
      POSTGRES_USER: mailsim
      POSTGRES_PASSWORD: mailsim
      POSTGRES_DB: mailsim
    networks: [sandbox]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailsim"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - sandbox-pgdata:/var/lib/postgresql/data

  # The only container with a route out, and only to the allowlisted LLM endpoint(s).
  egress-proxy:
    profiles: ["app"]
    build: ./deploy/egress_proxy
    environment:
      EGRESS_ALLOWLIST: ${MAILSIM_EGRESS_ALLOWLIST:-api.anthropic.com:443}
      EGRESS_LISTEN_HOST: 0.0.0.0  # reachable only from `sandbox` (no published port)
      EGRESS_LISTEN_PORT: "3128"
    networks: [sandbox, egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # `sim` CLI / scenario runner.
  app:
    profiles: ["app"]
    build: .
    image: mailsim-sim:local
    environment: *sandboxed-env
    depends_on:
      sandbox-db:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    networks: [sandbox]

  # REST API + IMAP/SMTP listeners. Reachable only from containers on `sandbox` (an internal
  # network publishes no host ports): run the agent under test in a container on `sandbox`.
  api:
    profiles: ["app"]
    build: .
    image: mailsim-sim:local
    entrypoint: ["/app/.venv/bin/python", "-m", "mailsim.serve"]
    command: ["serve", "--host", "0.0.0.0", "--port", "8000",
              "--imap-port", "1143", "--smtp-port", "1587", "--tls-self-signed"]
    environment:
      <<: *sandboxed-env
      MAILSIM_BLOB_DIR: /tmp/mailsim-blobs
    healthcheck:
      test: ["CMD", "python", "-I", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      sandbox-db:
        condition: service_healthy
      egress-proxy:
        condition: service_started
    networks: [sandbox]

  # Network-level egress proof, run in the simulator image with the simulator's networks/env.
  egress-check:
    profiles: ["app"]
    build: .
    image: mailsim-sim:local
    entrypoint: ["python", "-I", "/egress/egress_check.py"]
    command: ["--proxy", "http://egress-proxy:3128",
              "--allowed", "${MAILSIM_EGRESS_CHECK_ALLOWED:-api.anthropic.com:443}"]
    environment: *sandboxed-env
    volumes:
      - ./tests/egress/egress_check.py:/egress/egress_check.py:ro
    depends_on:
      egress-proxy:
        condition: service_started
    networks: [sandbox]

networks:
  sandbox:
    internal: true
  egress: {}
  host-access: {}

volumes:
  pgdata: {}
  sandbox-pgdata: {}
