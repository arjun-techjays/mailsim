name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: mailsim, POSTGRES_PASSWORD: mailsim, POSTGRES_DB: mailsim}
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U mailsim" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # exact tag: setup-uv has no v10 major tag
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest --cov=mailsim --cov-branch
      - run: uv run alembic upgrade head && uv run alembic check
        env: {MAILSIM_DATABASE_URL: "postgresql+psycopg://mailsim:mailsim@localhost:54329/mailsim"}
  web:
    runs-on: ubuntu-24.04
    defaults:
      run: {working-directory: web}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
