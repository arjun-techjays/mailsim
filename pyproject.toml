[project]
name = "mailsim"
version = "0.1.0"
description = "Deterministic, provider-neutral email simulation engine for testing AI agents (Phase 1: core engine)"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.scripts]
sim = "mailsim.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailsim"]
dev-mode-dirs = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "TID", "DTZ", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ"]
"migrations/**" = ["S"]

# External delivery must be impossible: no mail/network client libraries in src/.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"smtplib".msg = "Real SMTP is forbidden: the simulator must never deliver externally."
"aiosmtplib".msg = "Real SMTP is forbidden: the simulator must never deliver externally."
"socket".msg = "Raw sockets are forbidden in the simulator core (no external delivery)."
"requests".msg = "Network clients are forbidden in the simulator core."
"httpx".msg = "Network clients are forbidden in the simulator core."
"urllib.request".msg = "Network clients are forbidden in the simulator core."

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/mailsim"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = ["db: requires PostgreSQL"]

[tool.coverage.run]
source = ["src/mailsim"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.importlinter]
root_package = "mailsim"

[[tool.importlinter.contracts]]
name = "Layering: domain is the bottom layer"
type = "layers"
layers = ["(mailsim.cli)", "(mailsim.engine)", "(mailsim.scenario)", "mailsim.store", "mailsim.mime | mailsim.threads | mailsim.providers", "mailsim.domain"]
