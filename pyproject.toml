[project]
name = "mailsim"
version = "0.1.0"
description = "Deterministic, provider-neutral email simulation engine for testing AI agents (Phase 1: core engine)"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "fastapi>=0.143.1",
  "uvicorn>=0.30",
  "aiosmtpd>=1.4.6",
  "mcp>=2.3.0",
  "anthropic>=1.14.0",
  "httpx>=0.28.1",
]

[project.optional-dependencies]
# `sim import enron` reads the Hugging Face parquet shards (docs/leadership-inboxes.md).
import = ["pyarrow==25.0.1"]

[project.scripts]
sim = "mailsim.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "types-PyYAML",
  "google-api-python-client>=2.201.0",
  "msgraph-sdk>=1.64.0",
  "pyarrow==25.0.1",  # importer tests build a tiny synthetic parquet fixture
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailsim"]
dev-mode-dirs = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "TID", "DTZ", "SIM"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "DTZ", "TID251"]
# Narrow, reviewed exemptions from the network/process ban (see docs/architecture: D4):
"src/mailsim/protocols/tls.py" = ["TID251"]  # ssl for STARTTLS on inbound listeners
"src/mailsim/runner/command.py" = ["TID251", "S603", "S607"]  # spawn the agent under test
"src/mailsim/llm/providers/anthropic.py" = ["TID251"]  # model egress via the allowlist proxy
"src/mailsim/llm/providers/openai_compatible.py" = ["TID251"]  # (local Ollama endpoint)
"src/mailsim/llm/providers/claude_cli.py" = ["TID251", "S603", "S607"]  # local Claude Code CLI
# NOTE: per-file ignores disable the whole rule; tests/integration/test_safety.py enforces the
# exact per-module allowlist (e.g. tls.py may import ssl and nothing else banned).
"migrations/**" = ["S"]

# External delivery must be impossible: no mail/network client libraries in src/.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"smtplib".msg = "Real SMTP is forbidden: the simulator must never deliver externally."
"aiosmtplib".msg = "Real SMTP is forbidden: the simulator must never deliver externally."
"socket".msg = "Raw sockets are forbidden in the simulator core (no external delivery)."
"requests".msg = "Network clients are forbidden in the simulator core."
"httpx".msg = "Network clients are forbidden in the simulator core."
"httpx2".msg = "Network clients are forbidden in the simulator core (anthropic SDK transport)."
"aiohttp".msg = "Network clients are forbidden in the simulator core."
"http.client".msg = "Network clients are forbidden in the simulator core."
"ssl".msg = "TLS/socket helpers are forbidden in the simulator core."
"imaplib".msg = "Real IMAP is forbidden in the simulator core."
"ftplib".msg = "Network clients are forbidden in the simulator core."
"subprocess".msg = "Spawning processes is forbidden in the simulator core."
"urllib.request".msg = "Network clients are forbidden in the simulator core."
"aiosmtpd.handlers".msg = "aiosmtpd handlers can relay mail out (Proxy); write a sandbox handler."
"anthropic".msg = "Model SDKs only in mailsim/llm/providers/anthropic.py."
"openai".msg = "Model SDKs only in mailsim/llm/providers/openai_compatible.py."
"mcp.client".msg = "MCP client transports open network connections; the simulator is a server."
"poplib".msg = "Network clients are forbidden in the simulator core."
"telnetlib".msg = "Network clients are forbidden in the simulator core."

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/mailsim"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
markers = ["db: requires PostgreSQL"]

[tool.coverage.run]
source = ["src/mailsim"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.importlinter]
root_package = "mailsim"

[[tool.importlinter.contracts]]
name = "Layering"
type = "layers"
layers = [
  "(mailsim.cli) | (mailsim.serve)",
  "(mailsim.adapters) | (mailsim.protocols) | (mailsim.mcp) | (mailsim.runner) | (mailsim.bench)",
  "(mailsim.api)",
  "(mailsim.evaluation) | (mailsim.personas)",
  "(mailsim.llm)",
  "(mailsim.engine)",
  "(mailsim.importers)",
  "(mailsim.scenario)",
  "(mailsim.auth) | mailsim.store",
  "mailsim.mime | mailsim.threads | mailsim.providers",
  "mailsim.domain",
]

[[tool.importlinter.contracts]]
name = "Interfaces reach the engine only through role facades"
type = "forbidden"
source_modules = ["mailsim.api", "mailsim.adapters", "mailsim.protocols", "mailsim.mcp", "mailsim.runner", "mailsim.bench", "mailsim.personas", "mailsim.evaluation"]
forbidden_modules = ["mailsim.engine.core"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Corpus importers are offline tooling: nothing agent-facing or in the engine imports them"
type = "forbidden"
source_modules = ["mailsim.api", "mailsim.mcp", "mailsim.adapters", "mailsim.protocols", "mailsim.runner", "mailsim.bench", "mailsim.engine", "mailsim.personas", "mailsim.evaluation", "mailsim.llm", "mailsim.serve"]
forbidden_modules = ["mailsim.importers"]

[[tool.importlinter.contracts]]
name = "Only the gateway may touch concrete LLM providers"
type = "forbidden"
source_modules = ["mailsim.engine", "mailsim.evaluation", "mailsim.adapters", "mailsim.protocols", "mailsim.api", "mailsim.mcp", "mailsim.scenario", "mailsim.store", "mailsim.personas", "mailsim.runner", "mailsim.bench", "mailsim.cli"]
forbidden_modules = ["mailsim.llm.providers"]
allow_indirect_imports = true
